<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Palabra Secreta</title>
<meta name="description" content="Juego de lengua para pizarra digital de 2.º de Primaria: seguid las pistas, descartad palabras y encontrad la palabra secreta.">
<meta name="theme-color" content="#2440C8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Palabra Secreta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/lilita-one-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/andika-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Lilita One';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/lilita-one-latin-400-normal.woff2) format('woff2')}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>
<style>
/* Layout: one-screen classroom board. Clue file with the owl detective on the left, word cards on a desk panel on the right; single committed cobalt look for projection. */
:root{
  --bg:#2440C8; --bg-2:#1A2F9C; --bg-3:#13247E; --sky:#DCE4FF;
  --paper:#FFFCF4; --paper-2:#F3EEE0; --paper-3:#D9D1BC;
  --ink:#16204A; --ink-soft:#56608A; --line:#E4DECD;
  --sun:#FFC52E; --sun-d:#D49600;
  --coral:#EF5246; --coral-d:#B4342A;
  --mint:#22C38E; --mint-d:#118260;
  --team-a:#FFC52E; --team-b:#4FD1F5;
  --f-display:'Lilita One','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --f-text:'Andika','Trebuchet MS',Verdana,system-ui,sans-serif;
  --gap:clamp(10px,1.3vw,18px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background-color:var(--bg);color:var(--paper);font-family:var(--f-text);font-size:16px;
  background-image:radial-gradient(circle at 1px 1px, rgba(255,255,255,.09) 1.6px, transparent 2px);
  background-size:26px 26px;-webkit-tap-highlight-color:transparent;overflow-x:hidden;
}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.screen{
  min-height:100%;display:flex;flex-direction:column;position:relative;
  padding-left:max(16px, env(safe-area-inset-left,0px));
  padding-right:max(16px, env(safe-area-inset-right,0px));
  padding-block:16px;
}
.screen.enter{animation:screenIn .45s cubic-bezier(.2,.8,.3,1)}
@keyframes screenIn{from{opacity:0;transform:translateY(18px)}}

/* ---------- Art ---------- */
.art{width:100%;height:100%;display:block;overflow:visible}
.art .st{stroke:var(--ink);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.art .e{fill:var(--ink);stroke:none}
.art .h{fill:#fff;stroke:none;opacity:.55}
.art .n{stroke:none}
.art .ln{fill:none}

/* ---------- Mascot ---------- */
.lupi{display:block;overflow:visible}
.lupi .st{stroke:var(--ink);stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
.lupi .n{stroke:none}.lupi .ln{fill:none}
.lupi .eh,.lupi .bs{display:none}
.lupi.happy .eo{display:none}.lupi.happy .eh{display:inline}
.lupi.sad .bs{display:inline}
/* Reposo: respira, parpadea, mueve los penachos y de vez en cuando inspecciona con la lupa */
.lupi .bodyg{transform-origin:80px 160px;animation:bob 3.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px) rotate(-1deg)}}
.lupi .lid{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.lupi .tl{transform-origin:40px 54px;animation:tuftL 5.5s ease-in-out infinite}
.lupi .tr{transform-origin:120px 54px;animation:tuftR 5.5s ease-in-out infinite}
@keyframes tuftL{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(-14deg)}86%{transform:rotate(6deg)}90%{transform:rotate(-4deg)}}
@keyframes tuftR{0%,78%,100%{transform:rotate(0)}82%{transform:rotate(14deg)}86%{transform:rotate(-6deg)}90%{transform:rotate(4deg)}}
.lupi .arm{transform-origin:132px 102px;animation:scan 9s ease-in-out 2s infinite}
@keyframes scan{0%,62%,100%{transform:none}68%,74%{transform:translate(-30px,-24px) scale(1.18)}80%{transform:translate(-50px,-24px) scale(1.18)}86%{transform:translate(-30px,-24px) scale(1.18)}}
.lupi .glint{animation:glint 3s ease-in-out infinite}
@keyframes glint{0%,70%,100%{opacity:1}80%{opacity:.2}}
.lupi .wl{transform-origin:30px 100px}
.lupi .hat{transform-origin:80px 46px}
.lupi .spark{display:none}
.lupi .pu{transition:transform .25s ease-out}

/* Contento: salta, aletea, levanta el sombrero y brillan estrellitas */
.lupi.happy .bodyg{animation:hop .55s cubic-bezier(.3,1.6,.5,1), bob 3.2s ease-in-out .55s infinite}
@keyframes hop{40%{transform:translateY(-14px) scale(1.04)}}
.lupi.happy .wl{animation:flapL .18s ease-in-out 6 alternate}
@keyframes flapL{to{transform:rotate(28deg)}}
.lupi.happy .arm{animation:flapR .18s ease-in-out 6 alternate}
@keyframes flapR{to{transform:rotate(-16deg) translateY(-4px)}}
.lupi.happy .hat{animation:hatpop .6s cubic-bezier(.3,1.6,.5,1)}
@keyframes hatpop{45%{transform:translateY(-14px) rotate(-8deg)}}
.lupi.happy .spark{display:inline}
.lupi .spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 1.2s ease-in-out infinite}
.lupi .spark path:nth-child(2){animation-delay:.3s}.lupi .spark path:nth-child(3){animation-delay:.6s}
@keyframes twinkle{0%,100%{transform:scale(.3) rotate(0);opacity:.3}50%{transform:scale(1.15) rotate(45deg);opacity:1}}

/* Triste: se encoge, baja las alas y le cae una lágrima */
.lupi.sad .bodyg{animation:droop .6s ease, bob 3.2s ease-in-out .6s infinite}
@keyframes droop{30%{transform:translateY(4px) scaleY(.95) rotate(-4deg)}60%{transform:rotate(3deg)}}
.lupi.sad .wl{transform:rotate(-8deg)}
.lupi.sad .arm{animation:none;transform:rotate(10deg) translateY(4px)}
.lupi.sad .tl{animation:none;transform:rotate(18deg)}.lupi.sad .tr{animation:none;transform:rotate(-18deg)}
.lupi.sad .pu{transform:translate(0,5px)}
.lupi .tear{display:none}
.lupi.sad .tear{display:inline;animation:tear 1.4s ease-in .2s 2 backwards}
@keyframes tear{from{transform:translateY(-4px);opacity:0}20%{opacity:1}to{transform:translateY(22px);opacity:0}}

/* Pensativo: inclina la cabeza y se acerca la lupa al ojo */
.lupi.think .bodyg{animation:tilt .5s ease forwards}
@keyframes tilt{to{transform:rotate(-7deg)}}
.lupi.think .arm{animation:none;transform:translate(-30px,-24px) scale(1.18);transition:transform .4s cubic-bezier(.3,1.4,.5,1)}
.lupi.think .pu{transform:translate(5px,-4px)}

/* Al tocarlo: da un brinco con giro y ulula */
.lupi.tap .bodyg{animation:spinhop .75s cubic-bezier(.3,1.3,.5,1)}
@keyframes spinhop{30%{transform:translateY(-22px) rotate(-12deg)}60%{transform:translateY(-10px) rotate(12deg)}}
.lupi.tap .wl{animation:flapL .15s ease-in-out 4 alternate}
.lupi.tap .hat{animation:hatpop .6s cubic-bezier(.3,1.6,.5,1)}

/* Entrada en el mapa: cae desde arriba */
.lupi.jumpin .bodyg{animation:jumpin .8s cubic-bezier(.3,1.4,.5,1), bob 3.2s ease-in-out .8s infinite}
@keyframes jumpin{from{transform:translateY(-120px)}55%{transform:translateY(6px) scaleY(.9)}75%{transform:translateY(-6px)}}
.lupi-hit{cursor:pointer;-webkit-tap-highlight-color:transparent}

/* ---------- Buttons ---------- */
.btn{
  font-family:var(--f-display);font-size:1.3rem;letter-spacing:.02em;border:0;border-radius:18px;
  padding:.72em 1.3em;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sun-d);
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.5em;
  transition:transform .08s ease, box-shadow .08s ease, opacity .2s;touch-action:manipulation;line-height:1.1;
}
.btn svg{width:1.15em;height:1.15em;flex:none}
.btn:active:not([disabled]){transform:translateY(4px);box-shadow:0 2px 0 var(--sun-d)}
.btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:0 6px 0 rgba(8,16,70,.35)}
.btn.ghost:active:not([disabled]){box-shadow:0 2px 0 rgba(8,16,70,.35)}
.btn.blue{background:var(--bg);color:#fff;box-shadow:0 6px 0 var(--bg-2)}
.btn.blue:active:not([disabled]){box-shadow:0 2px 0 var(--bg-2)}
.btn.mint{background:var(--mint);color:#04382A;box-shadow:0 6px 0 var(--mint-d)}
.btn.mint:active:not([disabled]){box-shadow:0 2px 0 var(--mint-d)}
.btn.soft{background:var(--paper-2);color:var(--ink);box-shadow:0 6px 0 var(--paper-3)}
.btn.soft:active:not([disabled]){box-shadow:0 2px 0 var(--paper-3)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 6px 0 var(--coral-d)}
.btn.coral:active:not([disabled]){box-shadow:0 2px 0 var(--coral-d)}
.btn[disabled]{opacity:.4;cursor:default}
.btn.xl{font-size:clamp(1.45rem,2.3vw,2rem);padding:.62em 1.5em;border-radius:22px}
.btn.pulse:not([disabled]){animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.btn:focus-visible,.icon-btn:focus-visible,.card:focus-visible,.opt:focus-visible,.level:focus-visible{outline:4px solid #fff;outline-offset:3px}
.panel .btn:focus-visible,.panel .opt:focus-visible,.panel .level:focus-visible,.modal .btn:focus-visible,.clue .btn:focus-visible{outline-color:var(--bg)}
.icon-btn{width:52px;height:52px;border-radius:16px;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(8,16,70,.35)}
.icon-btn svg{width:26px;height:26px}
.icon-btn[aria-pressed="true"]{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--sun-d)}
.corner-music{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:3}
.icon-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(8,16,70,.35)}

/* ---------- Home ---------- */
.home{align-items:center;justify-content:center;overflow:hidden;padding-bottom:max(16px,14vh)}
.skyline{position:absolute;left:0;right:0;bottom:0;height:min(24vh,220px);z-index:0;pointer-events:none}
.skyline svg{width:100%;height:100%;display:block}
.hero{display:flex;align-items:center;gap:clamp(16px,4vw,56px);position:relative;z-index:2;flex-wrap:wrap;justify-content:center}
.hero .lupi{width:clamp(150px,20vw,270px);height:auto;filter:drop-shadow(0 10px 0 rgba(8,16,70,.35))}
.hero-text{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(14px,2.4vh,24px)}
.badge{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.14);border-radius:999px;padding:.45em 1.1em;font-weight:700;font-size:clamp(1rem,1.5vw,1.2rem);color:var(--sky);letter-spacing:.04em}
.wordmark{font-family:var(--f-display);font-weight:400;font-size:clamp(3.4rem,9.5vw,8.4rem);line-height:.86;color:#fff;text-shadow:0 .075em 0 var(--ink);letter-spacing:.01em}
.wordmark span{display:block}
.wordmark .w2{color:var(--sun)}
.tagline{font-size:clamp(1.15rem,1.9vw,1.5rem);max-width:30ch;line-height:1.35;color:#fff;opacity:.92}
.home-actions{display:flex;gap:16px 18px;flex-wrap:wrap}
.records{display:flex;gap:10px;flex-wrap:wrap}
.records span{background:rgba(8,16,70,.3);border-radius:12px;padding:.4em .9em;font-weight:700;font-size:1rem;color:var(--sky);display:inline-flex;gap:6px;align-items:center}
.records b{color:#fff;font-variant-numeric:tabular-nums}
.deco{position:absolute;width:170px;height:150px;z-index:1;pointer-events:none;animation:float 6s ease-in-out infinite}
.deco .card{width:100%;height:100%;transform:rotate(var(--r));animation:none}
@keyframes float{50%{translate:0 -10px}}
@media (max-width:1180px),(max-height:720px){.deco{display:none}}
@media (max-width:700px){.hero-text{align-items:center;text-align:center}.home-actions,.records{justify-content:center}}

/* ---------- Setup ---------- */
.setup{align-items:center;justify-content:center}
.panel{background:var(--paper);color:var(--ink);border-radius:32px;width:min(1140px,100%);padding:clamp(20px,3vw,40px);box-shadow:0 12px 0 rgba(8,16,70,.3);display:grid;gap:clamp(18px,2.6vh,28px);margin-block:auto}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.panel h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,3.4vw,2.9rem);line-height:1}
.row{display:grid;gap:12px}
.row-label{font-family:var(--f-display);font-size:1.35rem;display:flex;align-items:center;gap:10px}
.row-label i{font-style:normal;width:34px;height:34px;border-radius:10px;background:var(--bg);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.seg{display:flex;gap:12px;flex-wrap:wrap}
.opt{font-weight:700;font-size:1.15rem;padding:.6em 1.15em;border-radius:16px;border:3px solid var(--line);background:#fff;color:var(--ink);cursor:pointer}
.opt[aria-pressed="true"]{border-color:var(--bg);background:var(--sky)}
.teams-in{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:620px}
.teams-in label{display:grid;gap:6px;font-weight:700;color:var(--ink-soft)}
.teams-in input{font:700 1.2rem var(--f-text);padding:.55em .8em;border-radius:14px;border:3px solid var(--line);color:var(--ink);background:#fff;width:100%;min-width:0}
.teams-in input:focus{outline:none;border-color:var(--bg)}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.level{text-align:left;border:3px solid var(--line);border-radius:24px;padding:16px 18px 18px;background:#fff;cursor:pointer;display:grid;gap:10px;color:var(--ink);align-content:start;transition:transform .15s}
.level:hover{transform:translateY(-3px)}
.level[aria-pressed="true"]{border-color:var(--bg);box-shadow:0 0 0 4px var(--sky)}
.lv-top{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em;font-size:.9rem}
.lv-stars{display:flex;gap:2px}
.lv-stars svg{width:20px;height:20px}
.lv-art{display:flex;gap:8px;height:58px;align-items:center}
.lv-art span{width:58px;height:58px;border-radius:14px;background:var(--paper-2);padding:7px;display:grid;place-items:center}
.lv-art .txt{font-weight:700;font-size:1.05rem;width:auto;padding:0 12px;color:var(--ink)}
.lv-name{font-family:var(--f-display);font-size:clamp(1.7rem,2.3vw,2.1rem);line-height:1}
.lv-meta{display:flex;flex-wrap:wrap;gap:6px}
.lv-meta span{background:var(--paper-2);border-radius:10px;padding:.25em .6em;font-weight:700;font-size:.95rem}
.lv-skills{color:var(--ink-soft);font-size:1rem;line-height:1.4}
.setup-foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.stat-line{color:var(--ink-soft);font-weight:700;font-size:1.1rem}
@media (max-width:820px){.levels{grid-template-columns:1fr}.teams-in{grid-template-columns:1fr}}

/* ---------- Map ---------- */
.map{align-items:center;justify-content:center;gap:clamp(16px,3vh,32px);text-align:center}
.map-title{display:grid;gap:8px;justify-items:center}
.eyebrow{font-family:var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--bg);font-size:1.1rem}
.map .eyebrow{color:var(--sun)}
.map h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,5.5vw,4.6rem);line-height:.95;color:#fff;text-shadow:0 .07em 0 var(--ink)}
.route{position:relative;width:min(1100px,100%);aspect-ratio:1000/300;max-width:100%}
.route svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;transform:translate(-50%,-50%);width:clamp(46px,7vw,84px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:clamp(1.3rem,2.4vw,2.2rem);background:var(--bg-3);color:rgba(255,255,255,.55);box-shadow:inset 0 -6px 0 rgba(0,0,0,.2)}
.node.done{background:var(--mint);color:#fff;box-shadow:inset 0 -6px 0 var(--mint-d)}
.node.now{background:var(--sun);color:var(--ink);box-shadow:inset 0 -6px 0 var(--sun-d),0 0 0 8px rgba(255,197,46,.3);animation:pulse 1.4s ease-in-out infinite}
.node .ns{position:absolute;top:100%;margin-top:6px;display:flex;gap:2px;left:50%;transform:translateX(-50%)}
.node .ns svg{width:clamp(14px,1.8vw,22px);height:auto}
.node .lupi{position:absolute;bottom:92%;width:clamp(70px,10vw,124px);height:auto;left:50%;transform:translateX(-50%);filter:drop-shadow(0 6px 0 rgba(8,16,70,.35))}
.map-foot{display:flex;flex-direction:column;align-items:center;gap:16px}
.mini-scores{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-left:0}

/* ---------- Game ---------- */
.game{gap:12px}
@media (min-width:761px){.game{height:100%}}
.topbar{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap}
.brand-mini{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-size:1.45rem;color:#fff;white-space:nowrap}
.brand-mini svg{width:40px;height:40px}
.case-chip{background:rgba(255,255,255,.14);border-radius:999px;padding:.45em 1em;font-weight:700;color:#fff;font-size:1.05rem;white-space:nowrap}
.scores{display:flex;gap:12px;margin-left:auto;flex-wrap:wrap}
.score{display:flex;align-items:center;gap:10px;background:var(--paper);color:var(--ink);border-radius:18px;padding:6px 16px 6px 12px;box-shadow:0 5px 0 rgba(8,16,70,.35);border:3px solid transparent;transition:border-color .2s, transform .2s}
.score .dot{width:16px;height:16px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 2px rgba(22,32,74,.2)}
.score .nm{font-weight:700;font-size:1.05rem;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.score .pts{font-family:var(--f-display);font-size:1.9rem;font-variant-numeric:tabular-nums;min-width:2.4ch;text-align:right;line-height:1}
.score.active{border-color:var(--sun);transform:translateY(-2px)}
.score.bump .pts{animation:bump .4s}
@keyframes bump{40%{transform:scale(1.25)}}
.tools{display:flex;gap:10px}

.stage{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,.42fr) 1fr;gap:clamp(14px,2vw,26px);padding-bottom:8px}
@media (max-width:1000px){.stage{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}}

.clue{background:var(--paper);color:var(--ink);border-radius:28px;padding:clamp(16px,1.8vw,26px);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 0 rgba(8,16,70,.3);min-height:0;overflow:auto}
.coach{display:flex;align-items:flex-end;gap:10px;min-height:92px}
.coach .lupi{width:88px;height:auto;flex:none}
.bubble{position:relative;background:var(--sky);border-radius:18px;padding:10px 14px;font-weight:700;font-size:1.12rem;line-height:1.3;margin-bottom:16px;flex:1;min-width:0}
.bubble::before{content:"";position:absolute;left:-10px;bottom:12px;border:10px solid transparent;border-right-color:var(--sky);border-left:0}
.bubble.pop{animation:bpop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes bpop{from{transform:scale(.85);opacity:.4}}
.clue-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.progress{display:flex;gap:6px}
.progress i{width:26px;height:10px;border-radius:6px;background:var(--line)}
.progress i.done{background:var(--mint)}
.progress i.now{background:var(--sun)}
.turn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;background:var(--paper-2);border-radius:999px;padding:.35em 1em;font-size:1.05rem}
.turn .dot{width:14px;height:14px;border-radius:50%}
.clue-card{display:grid;gap:10px}
.clue-card.flip{animation:flipIn .5s cubic-bezier(.2,.8,.3,1)}
@keyframes flipIn{from{transform:perspective(600px) rotateX(-70deg);opacity:0}}
.clue-visual{min-height:68px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.v-tile{font-family:var(--f-display);font-size:2.3rem;min-width:66px;height:66px;padding:0 .35em;border-radius:16px;background:var(--bg);color:#fff;display:grid;place-items:center;box-shadow:0 5px 0 var(--bg-2);line-height:1}
.v-tile.sm{font-size:1.45rem}
.v-tile.alt{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--sun-d)}
.v-tile.no{position:relative;background:var(--paper-2);color:var(--ink-soft);box-shadow:0 5px 0 var(--paper-3)}
.v-tile.no::after{content:"";position:absolute;inset:50% 8px auto;height:6px;border-radius:3px;background:var(--coral);transform:rotate(-35deg)}
.v-pill{width:48px;height:32px;border-radius:16px;background:var(--sun);box-shadow:0 4px 0 var(--sun-d)}
.v-sq{width:20px;height:30px;border-radius:6px;background:var(--bg)}
.v-dot{width:28px;height:28px;border-radius:50%;background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.v-blank{width:28px;height:8px;border-radius:5px;background:var(--line);align-self:flex-end;margin-bottom:12px}
.clue-text{font-family:var(--f-display);font-weight:400;font-size:clamp(1.9rem,2.8vw,3.1rem);line-height:1.04;text-wrap:balance}
.clue-text em{font-style:normal;color:var(--bg)}
.clue-sub{font-size:1.2rem;color:var(--ink-soft);line-height:1.35}
.counter{display:flex;align-items:center;gap:10px;font-weight:700;font-size:1.1rem}
.counter .cnt{font-family:var(--f-display);font-weight:400;font-size:1.6rem;min-width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#FFF2CC;color:#694C00}
.counter.done .cnt{background:#D5F5E8;color:#0A5A40}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:6px}
.actions .btn{font-size:1.12rem;padding:.7em .6em}
.actions .wide{grid-column:1/-1}
.trail{list-style:none;margin:0;padding:12px 0 0;display:grid;gap:6px;border-top:2px dashed var(--line)}
.trail li{display:flex;gap:10px;align-items:flex-start;color:var(--ink-soft);font-weight:700;font-size:1rem;line-height:1.3}
.trail svg{width:20px;height:20px;flex:none;color:var(--mint-d);margin-top:1px}
.trail:empty{display:none}

/* ---------- Word cards ---------- */
.desk{min-height:0;border-radius:30px;background:rgba(10,20,90,.28);box-shadow:inset 0 4px 0 rgba(0,0,0,.12);padding:clamp(12px,1.6vw,22px);display:flex}
.board{flex:1;position:relative;display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--gap);min-height:0;--cols:4;--rows:2}
.card{
  flex:0 0 calc((100% - (var(--cols) - 1) * var(--gap)) / var(--cols));
  height:calc((100% - (var(--rows) - 1) * var(--gap) - 8px) / var(--rows));
  position:relative;container-type:size;border:0;border-radius:24px;background:var(--paper);color:var(--ink);
  box-shadow:0 8px 0 var(--paper-3),0 16px 24px rgba(8,16,70,.25);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;cursor:pointer;
  transition:transform .3s cubic-bezier(.2,.8,.3,1.3), background .25s, box-shadow .25s;padding:8px;
}
.card.deal{animation:deal .55s cubic-bezier(.2,.9,.3,1.2) backwards;animation-delay:var(--d,0s)}
@keyframes deal{from{opacity:0;transform:translateY(-70px) rotate(-10deg) scale(.6)}}
.card:active:not(.out){transform:translateY(5px);box-shadow:0 3px 0 var(--paper-3),0 8px 14px rgba(8,16,70,.25)}
.pic{width:min(60cqi,56cqh);height:min(60cqi,56cqh);display:flex;justify-content:center;flex:none}
.pic.pl{width:min(84cqi,56cqh)}
.pic.pl .art{width:64%;height:auto;align-self:center}
.pic.pl .art+.art{margin-left:-14%;transform:translateY(-6%)}
.word{font-family:var(--f-text);font-weight:700;font-size:min(13cqi,16cqh);line-height:1.05;letter-spacing:.01em}
.nopic .word{font-size:min(15cqi,28cqh)}
.why{position:absolute;left:0;right:0;bottom:3.5cqh;font-weight:700;font-size:min(7.5cqi,9cqh);color:var(--coral-d);opacity:0;transition:opacity .3s .15s;text-align:center;padding:0 6px}
.stamp{position:absolute;top:9cqh;left:50%;transform:translateX(-50%) rotate(-12deg) scale(1.8);opacity:0;border:min(1.6cqi,4px) solid var(--coral);color:var(--coral);font-family:var(--f-display);font-size:min(11cqi,14cqh);padding:.02em .45em;border-radius:12px;letter-spacing:.08em;text-transform:uppercase;transition:transform .28s cubic-bezier(.3,1.6,.5,1), opacity .2s;pointer-events:none;background:rgba(255,252,244,.7)}
.card.out{background:var(--paper-2);box-shadow:0 3px 0 var(--paper-3);transform:scale(.93) rotate(var(--rot,0deg));cursor:default}
.card.out .pic,.card.out .word{filter:grayscale(1);opacity:.35}
.card.out .why{opacity:1}
.card.out .stamp{opacity:1;transform:translateX(-50%) rotate(-12deg) scale(1)}
.card.shake{animation:shake .45s}
.card.shake::after{content:"";position:absolute;inset:0;border-radius:24px;box-shadow:inset 0 0 0 5px var(--coral);animation:fade .9s forwards}
@keyframes shake{20%{transform:translateX(-10px) rotate(-2deg)}40%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
@keyframes fade{to{opacity:0}}
.card.hint{animation:hint 1s ease-in-out 3}
@keyframes hint{50%{transform:scale(1.05) rotate(2deg);box-shadow:0 8px 0 var(--sun-d),0 0 0 8px var(--sun)}}
.board.guessing .card:not(.out){box-shadow:0 8px 0 var(--paper-3),0 0 0 5px var(--sun);animation:wob 1.6s ease-in-out infinite}
@keyframes wob{50%{transform:translateY(-5px)}}
.card.secret{background:#fff;box-shadow:0 8px 0 var(--mint-d),0 0 0 7px var(--mint);transform:scale(1.07);z-index:2}
.fp{position:absolute;top:30%;left:50%;font-family:var(--f-display);font-size:min(17cqi,22cqh);color:var(--mint-d);pointer-events:none;animation:fp 1.05s forwards;z-index:3;text-shadow:0 3px 0 #fff}
.fp.neg{color:var(--coral)}
@keyframes fp{0%{opacity:0;transform:translate(-50%,10%) scale(.6)}20%{opacity:1;transform:translate(-50%,-10%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-110%) scale(1)}}

@media (max-width:760px){
  .desk{padding:10px}
  .board{--cols:2}
  .card{height:auto;aspect-ratio:1/1}
  .scores{margin-left:0;width:100%}
  .coach .lupi{width:70px}
}

/* ---------- Overlays ---------- */
.overlay{position:fixed;inset:0;background:rgba(10,18,72,.76);display:grid;place-items:center;z-index:50;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:ovIn .25s}
@keyframes ovIn{from{opacity:0}}
.modal{position:relative;background:var(--paper);color:var(--ink);border-radius:32px;width:min(860px,100%);padding:clamp(22px,3.6vw,44px);box-shadow:0 14px 0 rgba(8,16,70,.35);text-align:center;max-height:100%;overflow:auto;display:grid;gap:16px;justify-items:center;animation:pop .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}}
.modal h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2.1rem,3.8vw,3.3rem);line-height:1;text-wrap:balance}
.modal .lead{font-size:1.3rem;color:var(--ink-soft);max-width:44ch;line-height:1.4}
.reveal-stage{position:relative;width:min(380px,84%);display:grid;place-items:center;padding:18px 0}
.burst{position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(rgba(255,197,46,.45) 0 9deg, transparent 9deg 18deg);-webkit-mask:radial-gradient(circle, #000 25%, transparent 68%);mask:radial-gradient(circle, #000 25%, transparent 68%);animation:spin 18s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(1turn)}}
.big-card{position:relative;width:100%;aspect-ratio:4/3;container-type:size;background:#fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;padding:8px;box-shadow:0 8px 0 var(--mint-d),0 0 0 6px var(--mint);animation:cardFlip .8s cubic-bezier(.2,.8,.3,1.2) .15s backwards}
@keyframes cardFlip{from{transform:perspective(700px) rotateY(180deg) scale(.6);opacity:0}}
.big-card .word{font-size:min(14cqi,17cqh)}
.reveal-lupi{position:absolute;right:-14%;bottom:-6%;width:34%;height:auto;z-index:2;filter:drop-shadow(0 6px 0 rgba(8,16,70,.25))}
.sylls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sylls span{font-weight:700;font-size:1.5rem;background:var(--sky);border-radius:12px;padding:.2em .6em}
.facts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.facts span{background:var(--paper-2);border-radius:10px;padding:.3em .75em;font-weight:700;font-size:1.05rem}
.case-stars{display:flex;gap:6px}
.case-stars svg{width:44px;height:44px}
.case-stars svg.on{animation:starIn .5s cubic-bezier(.3,1.7,.5,1) backwards}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.round-pts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.round-pts div{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:16px;padding:8px 16px;font-weight:700;font-size:1.15rem}
.round-pts b{font-family:var(--f-display);font-weight:400;font-size:1.8rem;color:var(--mint-d)}
.modal-actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;text-align:left;max-width:640px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;font-size:1.2rem;line-height:1.4}
.steps li b.n{width:44px;height:44px;border-radius:14px;background:var(--bg);color:#fff;font-family:var(--f-display);font-weight:400;font-size:1.4rem;display:grid;place-items:center}
.score-rules{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.score-rules span{border-radius:10px;padding:.3em .8em;font-weight:700}
.sr-plus{background:#D5F5E8;color:#0A5A40}.sr-minus{background:#FFE0DC;color:#8A1F17}
.how-head{display:flex;align-items:center;gap:16px;justify-content:center}
.how-head .lupi{width:90px;height:auto}

/* ---------- End ---------- */
.end{align-items:center;justify-content:center}
.end .panel{justify-items:center;text-align:center;width:min(960px,100%)}
.end-top{display:flex;align-items:flex-end;gap:16px;justify-content:center}
.end-top .lupi{width:clamp(100px,12vw,150px);height:auto}
.stars{display:flex;gap:8px;align-items:flex-end}
.stars svg{width:clamp(50px,6vw,74px);height:auto}
.stars svg:nth-child(2){width:clamp(62px,7.6vw,92px)}
.final-scores{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.final-scores div{display:grid;gap:4px;min-width:180px;border-radius:22px;padding:16px 22px;background:var(--paper-2)}
.final-scores div.win{background:#FFF2CC;box-shadow:0 0 0 4px var(--sun)}
.final-scores span{font-weight:700;color:var(--ink-soft)}
.final-scores b{font-family:var(--f-display);font-weight:400;font-size:3rem;line-height:1;font-variant-numeric:tabular-nums}
.solved{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.solved span{display:inline-flex;align-items:center;gap:8px;background:#fff;border:3px solid var(--line);border-radius:14px;padding:.25em .75em .25em .35em;font-weight:700;font-size:1.1rem}
.solved i{width:34px;height:34px;display:block}
.solved span.txt{padding-left:.75em}

/* ---------- Toast & confetti ---------- */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);background:var(--ink);color:#fff;padding:14px 22px;border-radius:18px;font-weight:700;font-size:1.2rem;transition:transform .3s cubic-bezier(.3,1.4,.5,1);z-index:60;max-width:calc(100% - 32px);display:flex;gap:12px;align-items:center;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.toast.show{transform:translate(-50%,0)}
.toast .ti{width:16px;height:16px;border-radius:50%;flex:none;background:var(--sun)}
.toast.ok .ti{background:var(--mint)}.toast.bad .ti{background:var(--coral)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;width:100%;height:100%}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>


<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-sound" viewBox="0 0 24 24"><path fill="currentColor" d="M4 9h3.5L12 5v14l-4.5-4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></symbol>

  <symbol id="i-music" viewBox="0 0 24 24"><path fill="currentColor" d="M9 17.5a3 3 0 1 1-2-2.83V5.5l12-3v12a3 3 0 1 1-2-2.83V6.6l-8 2z"/></symbol>
  <symbol id="i-music-off" viewBox="0 0 24 24"><path fill="currentColor" opacity=".45" d="M9 17.5a3 3 0 1 1-2-2.83V5.5l12-3v12a3 3 0 1 1-2-2.83V6.6l-8 2z"/><path d="M4 3 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
  <symbol id="i-full" viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>

  <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="m7.5 12.5 3 3 6-6.5" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/></symbol>
  <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.2 1.3-6.6-4.9-4.6 6.6-.8z" stroke-linejoin="round"/></symbol>
</svg>

<!-- HOME -->
<section class="screen home" id="s-home">
  <div class="skyline" aria-hidden="true">
    <svg viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice">
      <path fill="#1D35AE" d="M0 220V120h60V90h50v40h40V70h70v60h30V100h60v-20h40v60h50V60h80v80h30v-30h60v-40h50v60h40V90h70v50h40V70h60v50h50V100h40v-30h60v70h50v-40h70V220Z"/>
      <path fill="#162A8E" d="M0 220V170h80v-30h60v40h70v-50h50v60h80v-40h60v30h90v-60h40v70h70v-30h60v40h80v-50h50v50h70v-40h60v30h90v-50h50v60h60V220Z"/>
      <g fill="#FFC52E" opacity=".55"><rect x="120" y="110" width="10" height="12" rx="2"/><rect x="196" y="90" width="10" height="12" rx="2"/><rect x="460" y="84" width="10" height="12" rx="2"/><rect x="490" y="110" width="10" height="12" rx="2"/><rect x="770" y="100" width="10" height="12" rx="2"/><rect x="840" y="88" width="10" height="12" rx="2"/><rect x="1040" y="110" width="10" height="12" rx="2"/><rect x="300" y="160" width="10" height="12" rx="2"/><rect x="640" y="150" width="10" height="12" rx="2"/><rect x="980" y="172" width="10" height="12" rx="2"/></g>
    </svg>
  </div>
  <div class="deco" style="left:4%;top:9%;animation-delay:-1s"><div class="card" style="--r:-8deg"><span class="pic" data-art="mariposa"></span><span class="word">mariposa</span></div></div>
  <div class="deco" style="right:4%;top:11%;animation-delay:-3s"><div class="card out" style="--r:7deg;--rot:7deg"><span class="pic" data-art="manzana"></span><span class="word">manzana</span><span class="why">man·za·na</span><span class="stamp">Fuera</span></div></div>
  <div class="deco" style="right:7%;bottom:24%;animation-delay:-2s"><div class="card secret" style="--r:-5deg"><span class="pic" data-art="cohete"></span><span class="word">cohete</span></div></div>

</section>

<!-- SETUP -->

      <button class="btn soft" id="b-back">Volver</button>
    </div>

      <div class="row-label"><i>1</i>¿Quién juega?</div>

        <label for="team-a">Equipo 1<input id="team-a" maxlength="16" value="Linces"></label>

      <div class="row-label"><i>2</i>Nivel</div>

<!-- GAME -->
<section class="screen game" id="s-game" hidden>
  <header class="topbar">
    <div class="brand-mini" id="brand-mini">Palabra Secreta</div>
    <span class="case-chip" id="case-chip"></span>
    <div class="scores" id="scores"></div>
    <div class="tools">

/* Los ojos de Lupi siguen el dedo o el ratón */
let eyeRAF=0, eyeX=0, eyeY=0;
function trackEyes(e){ eyeX=e.clientX; eyeY=e.clientY; if(!eyeRAF) eyeRAF=requestAnimationFrame(lookAt); }
document.addEventListener('pointermove',trackEyes,{passive:true});
document.addEventListener('pointerdown',trackEyes,{passive:true});
function lookAt(){
  eyeRAF=0;
  document.querySelectorAll('.lupi:not(.sad):not(.think):not(.happy)').forEach(svg=>{
    const r=svg.getBoundingClientRect(); if(!r.width) return;
    const cx=r.left+r.width*.5, cy=r.top+r.height*.46, dx=eyeX-cx, dy=eyeY-cy, d=Math.hypot(dx,dy)||1, k=Math.min(1,d/260);
    const pu=svg.querySelector('.pu'); if(pu) pu.style.transform=`translate(${(dx/d*6*k).toFixed(1)}px,${(dy/d*5*k).toFixed(1)}px)`;
  });
}
/* Al tocar a Lupi: brinco, ululato y, durante el juego, una frase */
const HOOT=['¡Hu-hu! Soy Lupi, el detective de palabras.','¡Hu-hu! ¡Me hacéis cosquillas!','¡Hu-hu! Mirad bien la pista.','¡Hu-hu! ¡Qué buen equipo de detectives!','¡Hu-hu! ¿Sabíais que los búhos pueden girar mucho la cabeza?'];
function hoot(){ tone(392,0,.22,'sine',.12); tone(330,.26,.32,'sine',.12); }
document.addEventListener('click',e=>{
  const hit=e.target.closest('.lupi-hit'); if(!hit) return;
  const svg=hit.querySelector('.lupi'); if(!svg) return;
  svg.classList.remove('tap'); void svg.getBoundingClientRect(); svg.classList.add('tap');
  setTimeout(()=>svg.classList.remove('tap'),800); hoot();
  if(hit.id==='coach-lupi'){ const b=$('#bubble'); b.textContent=pick(HOOT); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop'); }
});

const SAY = {
  start:['¡Leed bien la pista!','Pista nueva. ¿Qué palabras sobran?','¡A investigar, detectives!','Mirad todas las palabras con calma.'],
  ok:['¡Bien visto!','¡Eso es!','¡Muy bien, detectives!','¡Fuera esa!','¡Genial!','¡Así se hace!'],
  bad:['¡Uy! Esa sí cumple la pista.','Esa se queda. Mirad otra vez la pista.','¡Casi! Esa palabra sí vale.'],
  step:['¡Pista resuelta! Vamos a por la siguiente.','¡Ninguna sobra ya! Pulsad «Siguiente pista».'],
  guess:['¿Cuál será? Tocad la palabra secreta.'],
  guessBad:['¡No era esa! Seguid investigando.'],
  help:['Pssst… mirad la tarjeta que se mueve.'],
  win:['¡Caso resuelto!']
};
function setCoach(kind, text){
  const el=$('#coach-lupi'); const mood = {ok:'happy',step:'happy',win:'happy',bad:'sad',guessBad:'sad',guess:'think',help:'think'}[kind]||'';
  el.innerHTML = lupi(mood);
  const b=$('#bubble'); b.textContent = text || pick(SAY[kind]); b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
}

function clueOptions(kind, S, lvl){
  const o = [];
  switch(kind){
    case 'silabas': { const n=S.syl.length;
      o.push({kind, text:`Tiene ${n} ${n===1?'sílaba':'sílabas'}`, sub:'Dad una palmada por cada sílaba.', vis:rep('<span class="v-pill"></span>',n),
        pred:w=>w.syl.length===n, why:w=>`${w.syl.join('·')} (${w.syl.length})`}); break; }
    case 'empieza': { const u=firstU(S);
      o.push({kind, text:`Empieza por <em>«${u}»</em>`, sub:'Fijaos en la primera letra.', vis:`<span class="v-tile">${u}</span>`+rep('<span class="v-blank"></span>',3),
        pred:w=>firstU(w)===u, why:w=>`empieza por ${firstU(w)}`}); break; }
    case 'termina': { const u=lastU(S);
      o.push({kind, text:`Termina en <em>«${u}»</em>`, sub:'Mirad la última letra.', vis:rep('<span class="v-blank"></span>',3)+`<span class="v-tile">${u}</span>`,
        pred:w=>lastU(w)===u, why:w=>`termina en ${lastU(w)}`}); break; }
    case 'letras': { const n=nLetters(S);
      o.push({kind, text:`Tiene ${n} letras`, sub:'Contad las letras una a una.', vis:rep('<span class="v-sq"></span>',n),
        pred:w=>nLetters(w)===n, why:w=>`${nLetters(w)} letras`}); break; }
    case 'tilde': { const t=hasTilde(S);
      o.push({kind, text:t?'Lleva tilde':'No lleva tilde', sub:t?'Buscad la rayita sobre una vocal: á, é, í, ó, ú.':'Ninguna de sus vocales lleva rayita.',
        vis:t?'<span class="v-tile alt">á</span><span class="v-tile alt">ó</span>':'<span class="v-tile no">á</span>',
        pred:w=>hasTilde(w)===t, why:w=>hasTilde(w)?'con tilde':'sin tilde'}); break; }
    case 'numero':
      if(S.num==='pl') o.push({kind, text:'Está en plural', sub:'Habla de varias cosas, no de una.', vis:rep('<span class="v-dot"></span>',3),
        pred:w=>w.num==='pl', why:w=>w.cat==='v'?'es un verbo':(w.num==='pl'?'plural':'singular')});
      else if(lvl.id==='facil' && S.num==='sg') o.push({kind, text:'Está en singular', sub:'Habla de una sola cosa.', vis:'<span class="v-dot"></span>',
        pred:w=>w.num==='sg', why:w=>w.num==='pl'?'plural':'singular'});
      break;
    case 'genero':
      if(S.cat==='s'){ const f=S.gen==='f';
        o.push({kind, text:f?'Es femenina':'Es masculina', sub:f?'Es un sustantivo que va con «la» o «las».':'Es un sustantivo que va con «el» o «los».',
          vis:f?'<span class="v-tile">la</span><span class="v-tile">las</span>':'<span class="v-tile">el</span><span class="v-tile">los</span>',
          pred:w=>w.cat==='s'&&w.gen===S.gen, why:w=>w.cat==='s'?`${article(w)} ${w.word}`:`es un ${CAT[w.cat]}`}); }
      break;
    case 'categoria': {
      const T={s:['Es un sustantivo','Nombra una persona, un animal o una cosa.','nombre'],a:['Es un adjetivo','Dice cómo es algo o alguien.','¿cómo es?'],v:['Es un verbo','Es una acción, algo que se hace.','acción']}[S.cat];
      o.push({kind, text:T[0], sub:T[1], vis:`<span class="v-tile sm">${T[2]}</span>`, pred:w=>w.cat===S.cat, why:w=>CAT[w.cat]}); break; }
    case 'campo':
      if(CLUE_FIELD[S.field]) o.push({kind, text:CLUE_FIELD[S.field], sub:'Pensad en lo que significa cada palabra.', vis:`<span class="v-tile sm alt">${FIELD[S.field]}</span>`,
        pred:w=>w.cat==='s'&&w.field===S.field, why:kindOf});
      break;
    case 'silaba':
      if(S.syl.length>1) [...new Set(S.syl.map(base))].forEach(s=>o.push({kind, text:`Tiene la sílaba <em>«${s}»</em>`, sub:'Separad cada palabra en sílabas y buscadla.',
        vis:`<span class="v-tile">${s}</span>`, pred:w=>w.syl.some(x=>base(x)===s), why:w=>w.syl.join('·')}));
      break;
  }
  return o;
}
function relationClues(S){
  const o=[]; const g=groupOf(S.word);
  if(g) g.filter(x=>x!==S.word && !/s$/.test(x)).forEach(X=>o.push({kind:'sinonimo', ref:X, text:`Significa lo mismo que <em>«${X}»</em>`, sub:'Es un sinónimo: las dos palabras quieren decir lo mismo.',
    vis:`<span class="v-tile alt">=</span><span class="v-tile sm">${X}</span>`, pred:w=>w.word!==X && g.includes(w.word), why:()=>'significa otra cosa'}));
  ANT.forEach(([a,b])=>{
    const ga=groupOf(a), gb=groupOf(b);
    [[ga,gb],[gb,ga]].forEach(([mine,other])=>{
      if(mine.includes(S.word)) other.filter(x=>!/s$/.test(x)).forEach(X=>o.push({kind:'antonimo', ref:X, text:`Es lo contrario de <em>«${X}»</em>`, sub:'Es un antónimo: significa lo opuesto.',
        vis:`<span class="v-tile alt">↔</span><span class="v-tile sm">${X}</span>`, pred:w=>mine.includes(w.word), why:()=>'no es lo contrario'}));
    });
  });
  return o;
}

function generateRound(lvl, avoid, pics){
  let pool = lvl.sOnly ? BANK.filter(w=>w.cat==='s') : BANK;
  if(pics) pool = pool.filter(w=>w.art);
  for(let t=0;t<900;t++){
    let S = pick(pool);
    if(lvl.rel && t<400 && Math.random()<.6){ const withRel = pool.filter(w=>groupOf(w.word)); if(withRel.length) S = pick(withRel); }
    if(avoid.has(S.word) && t<800) continue;
    const rel = lvl.rel ? relationClues(S) : [];
    const useRel = rel.length>0 && (t<500 || Math.random()<.5);
    const need = lvl.steps.length - (useRel?1:0);
    const clues = [];
    for(const k of shuffle(lvl.kinds)){ if(clues.length>=need) break; const op=clueOptions(k,S,lvl); if(op.length) clues.push(pick(op)); }
    if(clues.length<need) continue;
    if(useRel) clues.push(pick(rel));
    const banned = new Set(clues.filter(c=>c.ref).map(c=>c.ref)); banned.add(S.word);
    const used = new Set([S.word]); const cards=[S]; let ok=true;
    for(let i=0;i<clues.length;i++){
      const cands = pool.filter(w=>!used.has(w.word) && !banned.has(w.word) && clues.slice(0,i).every(c=>c.pred(w)) && !clues[i].pred(w));
      if(cands.length<lvl.steps[i]){ ok=false; break; }
      shuffle(cands).slice(0,lvl.steps[i]).forEach(w=>{ used.add(w.word); cards.push(w); });
    }
    if(ok) return {secret:S, clues, cards:shuffle(cards)};
  }
  return null;
}

let actx=null;
function ac(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(f, at, dur, type='triangle', vol=.16){
  if(!G.sound) return; const c=ac(); if(!c) return;
  try{ const t=c.currentTime+at, o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.value=f; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t+dur+.05); }catch(e){}
}

function confetti(){

  const cols=['#FFC52E','#22C38E','#EF5246','#4FD1F5','#FFFCF4','#FF8FB1'];

  let f=0; (function loop(){ ctx.clearRect(0,0,W,H); P.forEach(p=>{ p.vy+=.5; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.a+=p.va;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.a); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2); ctx.restore(); });
    if(++f<160) requestAnimationFrame(loop); else ctx.clearRect(0,0,W,H); })();

  };
  let on=false, cur='menu', timer=null, step=0, nextT=0, bus=null, noise=null;
  const ctx=()=>ac();
  function out(){ const c=ctx(); if(!c) return null; if(!bus){ bus=c.createGain(); bus.gain.value=.55; bus.connect(c.destination); } return bus; }
  function voice(type,f,t,dur,vol,vib){
    const c=ctx(), o=c.createOscillator(), g=c.createGain(); o.type=type; o.frequency.value=f;
    if(vib){ const l=c.createOscillator(), lg=c.createGain(); l.frequency.value=5.5; lg.gain.value=f*.006; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+dur+.6); }
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.02); g.gain.exponentialRampToValueAtTime(vol*.5,t+Math.max(.05,dur*.6)); g.gain.exponentialRampToValueAtTime(.0008,t+dur+.35);
    o.connect(g).connect(out()); o.start(t); o.stop(t+dur+.4);
  }
  function hat(t,vol){
    const c=ctx(); if(!noise){ noise=c.createBuffer(1,c.sampleRate*.08,c.sampleRate); const d=noise.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; }
    const s=c.createBufferSource(), hp=c.createBiquadFilter(), g=c.createGain(); s.buffer=noise; hp.type='highpass'; hp.frequency.value=7000;
    g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0005,t+.05); s.connect(hp).connect(g).connect(out()); s.start(t); s.stop(t+.08);
  }
  function kick(t){ const c=ctx(), o=c.createOscillator(), g=c.createGain(); o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(45,t+.12);
    g.gain.setValueAtTime(.22,t); g.gain.exponentialRampToValueAtTime(.001,t+.16); o.connect(g).connect(out()); o.start(t); o.stop(t+.2); }
  function tick(){
    const c=ctx(); if(!c||!on) return; const T=THEMES[cur], e=60/T.bpm/2;
    while(nextT < c.currentTime+.12){
      const i=step%T.mel.len;
      T.mel.ev.filter(n=>n.at===i).forEach(n=>voice(T.lead,n.f,nextT,(n.end-n.at)*e,T.leadVol,T.vib));
      T.bass.ev.filter(n=>n.at===i).forEach(n=>voice(T.bassType,n.f,nextT,(n.end-n.at)*e*T.bassLen,T.bassVol));
      if(T.hat && i%2===1) hat(nextT, T.kick?.05:.035);
      if(T.kick && i%8===0) kick(nextT);
      nextT+=e; step++;
    }
  }
  function start(){ const c=ctx(); if(!c) return; try{ c.resume(); }catch(e){} out(); step=0; nextT=c.currentTime+.08; clearInterval(timer); timer=setInterval(tick,25); }
  function stop(){ clearInterval(timer); timer=null; }
  function paint(){ document.querySelectorAll('.music-btn').forEach(b=>{ b.setAttribute('aria-pressed',on); b.innerHTML=`<svg><use href="#i-music${on?'':'-off'}"/></svg>`; }); }
  return {
    toggle(){ on=!on; try{ localStorage.setItem('ps-music', on?'1':'0'); }catch(e){} if(on) start(); else stop(); paint(); },
    theme(t){ if(t===cur) return; cur=t; if(on) start(); },
    duck(sec){ if(!on||!bus) return; const c=ctx(), t=c.currentTime; bus.gain.cancelScheduledValues(t); bus.gain.setValueAtTime(bus.gain.value,t); bus.gain.linearRampToValueAtTime(.12,t+.15); bus.gain.setValueAtTime(.12,t+sec); bus.gain.linearRampToValueAtTime(.55,t+sec+.8); },
    pause(){ if(on) stop(); }, resume(){ if(on && !timer) start(); }, paint,
    restore(){ let saved=null; try{ saved=localStorage.getItem('ps-music'); }catch(e){}
      if(saved==='1'){ on=true; paint(); document.addEventListener('pointerdown',()=>{ if(on && !timer) start(); },{once:true,capture:true}); } }
  };
})();

/* ================= Juego ================= */
function startGame(){
  ac();
  const l=LEVELS[G.level];
  G.pics = G.picsOpt==='auto' ? l.pics : G.picsOpt==='si';
  G.teams = G.mode==='clase' ? [{name:'Clase', color:'var(--team-a)', score:0}]
    : [{name:($('#team-a').value.trim()||'Equipo 1'), color:'var(--team-a)', score:0},{name:($('#team-b').value.trim()||'Equipo 2'), color:'var(--team-b)', score:0}];
  G.roundNo=0; G.stats={ok:0,bad:0,early:0,solved:[]}; G.seen=new Set(); G.caseStars=[]; G.turn=0;
  showMap();
}
function nextRound(){
  closeOverlay();
  G.roundNo++; G.guess=false;
  const l=LEVELS[G.level];
  const r=generateRound(l, G.seen, G.pics); G.seen.add(r.secret.word);
  G.round={...r, cards:r.cards.map(w=>({w,out:false})), ci:0, done:false, earned:G.teams.map(()=>0), wrong:0};
  G.turn = (G.roundNo-1) % G.teams.length;
  $('#case-chip').textContent = `Caso ${G.roundNo} de ${G.rounds} · ${l.name}`;
  show('s-game');
  renderScores(); renderBoard(); renderClue(true);
}
function renderBoard(){
  const b=$('#board'); const r=G.round;
  b.classList.toggle('nopic',!G.pics); b.classList.remove('guessing');
  b.innerHTML = r.cards.map((c,i)=>`<button class="card deal" data-i="${i}" style="--rot:${(Math.random()*8-4).toFixed(1)}deg;--d:${(i*0.07).toFixed(2)}s">${G.pics?picHTML(c.w):''}<span class="word">${c.w.word}</span><span class="why"></span><span class="stamp">Fuera</span></button>`).join('');
  r.cards.forEach((c,i)=>{ c.el=b.children[i]; c.el.addEventListener('animationend',()=>c.el.classList.remove('deal'),{once:true}); setTimeout(()=>sfx.deal(i), i*70); });
  layoutBoard();
}
function layoutBoard(){
  const r=G.round; if(!r) return; const n=r.cards.length;
  const cols = innerWidth<=760 ? 2 : (n===9 ? 3 : 4);
  const b=$('#board'); b.style.setProperty('--cols',cols); b.style.setProperty('--rows',Math.ceil(n/cols));
}
addEventListener('resize',layoutBoard);

function renderScores(){ $('#scores').innerHTML = scoresHTML('sc'); }
const leftToDiscard = () => { const r=G.round, c=r.clues[r.ci]; return r.cards.filter(x=>!x.out && !c.pred(x.w)); };

function renderClue(isNew){
  const r=G.round, c=r.clues[r.ci], n=r.clues.length;
  $('#clue-num').textContent=`Pista ${r.ci+1} de ${n}`;
  $('#progress').innerHTML = r.clues.map((_,i)=>`<i class="${i<r.ci?'done':i===r.ci?'now':''}"></i>`).join('');
  $('#clue-vis').innerHTML=c.vis; $('#clue-text').innerHTML=c.text; $('#clue-sub').textContent=c.sub;
  const card=$('#clue-card'); card.classList.remove('flip'); void card.offsetWidth; card.classList.add('flip');
  const turn=$('#turn');
  if(G.teams.length>1){ const t=G.teams[G.turn]; turn.hidden=false; turn.innerHTML=`<span class="dot" style="background:${t.color}"></span>Turno de ${esc(t.name)}`; } else turn.hidden=true;
  $('#trail').innerHTML = r.clues.slice(0,r.ci).map(x=>`<li><svg aria-hidden="true"><use href="#i-check"/></svg><span>${x.text.replace(/<[^>]+>/g,'')}</span></li>`).join('');
  if(isNew) setCoach('start', r.ci===0 ? (G.teams.length>1?`¡Empiezan los ${G.teams[G.turn].name}! Leed la primera pista.`:'¡Nuevo caso! Leed la primera pista.') : undefined);
  updateStatus();
}
function updateStatus(){
  const r=G.round, left=leftToDiscard().length, last=r.ci===r.clues.length-1;
  const gb=$('#b-guess');
  gb.innerHTML = G.guess ? 'Cancelar' : '<svg aria-hidden="true"><use href="#i-spark"/></svg>¡Ya lo sé!';
  gb.className = G.guess ? 'btn soft wide' : 'btn coral wide';
  gb.disabled = r.done;
  $('#b-help').disabled = r.done || left===0 || G.guess;
  const ct=$('#counter'); $('#cnt').textContent = r.done ? '✓' : left;
  ct.classList.toggle('done', left===0 || r.done);
  $('#cnt-t').textContent = G.guess ? 'Tocad la palabra que creéis que es la secreta.'
    : r.done ? '¡Caso resuelto!'
    : left>0 ? (left===1?'palabra por descartar':'palabras por descartar')
    : last ? '¡Solo queda una palabra!' : 'Pista resuelta';
  const nb=$('#b-next'); nb.disabled = r.done || G.guess || left>0 || last; nb.classList.toggle('pulse', !nb.disabled);
}

function addPoints(n, el){
  const t=G.teams[G.turn], before=t.score; t.score=Math.max(0,t.score+n); G.round.earned[G.turn]+=t.score-before;
  if(el){ const f=document.createElement('span'); f.className='fp'+(n<0?' neg':''); f.textContent=(n>0?'+':'−')+Math.abs(n); el.appendChild(f); setTimeout(()=>f.remove(),1100); }
  renderScores(); const sc=$('#sc-'+G.turn); if(sc) sc.classList.add('bump');
}
function shake(el){ el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

$('#board').addEventListener('click',e=>{
  const el=e.target.closest('.card'); if(!el) return; const r=G.round; if(!r||r.done) return;
  const card=r.cards[+el.dataset.i]; if(card.out) return;
  const clue=r.clues[r.ci];
  if(G.guess){
    G.guess=false; $('#board').classList.remove('guessing');
    if(card.w===r.secret){ const hidden=r.clues.length-1-r.ci; addPoints(30+15*hidden, el); G.stats.early++; finishRound(true); }
    else { addPoints(-15, el); G.stats.bad++; r.wrong++; sfx.bad(); shake(el); setCoach('guessBad', `¡No era «${card.w.word}»! Seguid investigando.`); updateStatus(); }
    return;
  }
  if(!clue.pred(card.w)){
    card.out=true; el.classList.add('out'); el.querySelector('.why').textContent=clue.why(card.w);
    addPoints(10, el); G.stats.ok++; sfx.ok();
    if(leftToDiscard().length===0) stepComplete(); else { setCoach('ok'); updateStatus(); }
  } else {
    shake(el); addPoints(-5, el); G.stats.bad++; r.wrong++; sfx.bad();
    setCoach('bad', `¡Uy! «${card.w.word}» sí cumple la pista: ${clue.why(card.w)}.`);
  }
});
function stepComplete(){
  const r=G.round;
  if(r.ci===r.clues.length-1){ updateStatus(); const s=r.cards.find(c=>c.w===r.secret); setTimeout(()=>{ addPoints(30, s.el); finishRound(false); },500); }
  else { sfx.step(); setCoach('step'); updateStatus(); }
}
$('#b-next').onclick=()=>{ const r=G.round; if(r.ci>=r.clues.length-1) return; r.ci++; if(G.teams.length>1){ G.turn=(G.turn+1)%G.teams.length; renderScores(); } renderClue(true); sfx.tap(); };
$('#b-read').onclick=()=>{ const c=G.round.clues[G.round.ci]; MUSIC.duck(4.5); speak(c.text+'. '+c.sub); };
$('#b-help').onclick=()=>{ const l=leftToDiscard(); if(!l.length) return; const c=pick(l); c.el.classList.remove('hint'); void c.el.offsetWidth; c.el.classList.add('hint'); setTimeout(()=>c.el.classList.remove('hint'),3100); setCoach('help'); sfx.tap(); };
$('#b-guess').onclick=()=>{ G.guess=!G.guess; $('#board').classList.toggle('guessing',G.guess); if(G.guess) setCoach('guess'); else setCoach('start','Seguimos con la pista.'); updateStatus(); sfx.tap(); };

function finishRound(early){
  const r=G.round; r.done=true; G.guess=false; $('#board').classList.remove('guessing');
  r.cards.forEach(c=>{ if(c.w===r.secret) c.el.classList.add('secret'); else if(!c.out && early){ c.out=true; c.el.classList.add('out'); } });
  const stars = r.wrong===0?3:r.wrong<=2?2:1; G.caseStars.push(stars);
  G.stats.solved.push(r.secret); updateStatus(); setCoach('win', early?'¡Increíble! Lo habéis adivinado antes de tiempo.':'¡Caso resuelto! Sois unos detectives geniales.');
  sfx.win(); confetti();
  setTimeout(()=>revealModal(early, stars), 1100);
}
function revealModal(early, stars){

function endGame(){
  closeOverlay();
  const s=G.stats, total=s.ok+s.bad, acc=total?s.ok/total:1;
  const stars = acc>=.9?3:acc>=.7?2:1;
  const best=Math.max(...G.teams.map(t=>t.score));
  const rec=store.get('ps-records',{}); const newRec = best>(rec[G.level]||0); if(newRec){ rec[G.level]=best; store.set('ps-records',rec); }

  if(G.teams.length>1){ const [a,b]=G.teams; title = a.score===b.score ? '¡Empate! Los dos equipos son geniales' : `¡Ganan los ${esc((a.score>b.score?a:b).name)}!`; }

    <div class="final-scores">${G.teams.map(t=>`<div class="${G.teams.length>1&&t.score===best?'win':''}"><span>${esc(t.name)}</span><b>${t.score}</b><span>puntos</span></div>`).join('')}</div>
    ${newRec?'<span class="stat-line" style="color:var(--mint-d)">¡Nuevo récord en este nivel!</span>':''}

    <div class="solved">${s.solved.map(w=>w.art?`<span><i>${artSVG(w.art)}</i>${w.word}</span>`:`<span class="txt">${w.word}</span>`).join('')}</div>
    <div class="modal-actions">
      <button class="btn xl" id="b-again">Jugar otra vez</button>
      <button class="btn blue xl" id="b-change">Cambiar nivel</button>

      <li><b class="n">2</b><span>Lupi os da una pista. Por ejemplo: «Tiene tres sílabas» o «Es un verbo».</span></li>
      <li><b class="n">3</b><span>Tocad las palabras que <strong>no</strong> cumplen la pista para descartarlas.</span></li>
      <li><b class="n">4</b><span>Cuando no quede ninguna por descartar, pasad a la siguiente pista.</span></li>
      <li><b class="n">5</b><span>Al final solo queda una: ¡la palabra secreta! Si la sabéis antes, pulsad «¡Ya lo sé!».</span></li>
    </ol>
    <div class="score-rules">
      <span class="sr-plus">+10 descartar bien</span><span class="sr-plus">+30 encontrar la secreta</span><span class="sr-plus">+15 por cada pista ahorrada</span>
      <span class="sr-minus">−5 descartar una que sí cumple</span><span class="sr-minus">−15 fallar con «¡Ya lo sé!»</span>
    </div>
    <div class="modal-actions"><button class="btn xl" id="b-ok">¡Entendido!</button></div>`);
  $('#b-ok').onclick=closeOverlay;
}
$('#b-exit').onclick=()=>{
  openOverlay(`${lupi('sad').replace('class="lupi','style="width:110px;height:auto" class="lupi')}<h2>¿Salir de la partida?</h2><p class="lead">Volveréis a la portada y se perderán los puntos de esta partida.</p>
    <div class="modal-actions"><button class="btn soft xl" id="b-stay">Seguir jugando</button><button class="btn coral xl" id="b-leave">Salir</button></div>`);
  $('#b-stay').onclick=closeOverlay;
  $('#b-leave').onclick=()=>{ closeOverlay(); G.round=null; renderRecords(); show('s-home'); };
};
$('#b-sound').onclick=()=>{ G.sound=!G.sound; $('#b-sound').innerHTML=`<svg><use href="#i-${G.sound?'sound':'mute'}"/></svg>`; if(!G.sound){ try{speechSynthesis.cancel()}catch(e){} } };
$('#b-full').onclick=()=>{ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(()=>toast('Este navegador no permite la pantalla completa aquí.')); }catch(e){ toast('Este navegador no permite la pantalla completa aquí.'); } };
document.addEventListener('animationend',e=>{ const s=e.target.closest?.('.score'); if(s) s.classList.remove('bump'); });

renderRecords();
</script>

<script>
/* PWA: funcionamiento sin conexión e instalación */
if('serviceWorker' in navigator){ addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let deferredPrompt=null;
addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('b-install').hidden=false; });
document.getElementById('b-install').addEventListener('click',async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; document.getElementById('b-install').hidden=true; });
addEventListener('appinstalled',()=>{ document.getElementById('b-install').hidden=true; });
</script>
</body>
